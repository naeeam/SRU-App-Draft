
version: 1
backend:
  phases:
    build:
      commands:
        - echo "=== DIAGNOSTIC START ==="
        - node --version
        - npm --version
        - echo "=== STARTING NPM CI ==="
        - npm install --no-audit --no-fund --loglevel verbose
        - echo "=== NPM CI COMPLETED ==="
        - npx ampx --version
        - echo "=== STARTING AMPLIFY BACKEND DEPLOY ==="
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - echo "=== BACKEND DEPLOY COMPLETED ==="
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
