name: KAH Settings checks
on:
  push:
    branches: [feature/kah-settings]
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing package-lock.json is out of sync; install without modifying it in CI.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx tsc --noEmit
